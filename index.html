<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- description 只描述頁面上真的看得到的內容。
         2026-08-09 資訊卡（服務保證／營業時間）暫時移除後，原本描述裡的
         「支援 LINE PAY／信用卡／匯款，開立電子發票」在頁面上已不存在，
         留著會造成搜尋結果與實際內容不符，故一併更新。資訊卡若復原，這裡要改回來。 -->
    <meta name="description" content="寶貝我愛你童裝｜全台門市美食團購 LINE 社群入口，附各店地址。另有童裝女裝用品 LINE 社群與 Facebook 社團，點選即可加入下單。">
    <title>寶貝我愛你童裝｜美食團購 LINE 下單</title>

    <!-- Open Graph／Twitter Card：本頁主要靠 LINE 分享與 FB 廣告貼文傳播，
         沒有這些標籤時預覽卡片會由平台自行猜測（可能抓到背景圖或空白）。 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="寶貝我愛你童裝">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:url" content="https://baby03.tw/">
    <meta property="og:title" content="寶貝我愛你童裝｜美食團購 LINE 下單">
    <meta property="og:description" content="全台門市美食團購 LINE 社群入口，附各店地址。點選門市即可加入社群跟團下單。">
    <!-- og-image 由店面招牌完稿重新構圖而成（1200x630），已移除 QR、板橋宏國店字樣與 FB 條 -->
    <meta property="og:image" content="https://baby03.tw/images/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="寶貝團購｜美食團購 LINE 下單">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="寶貝我愛你童裝｜美食團購 LINE 下單">
    <meta name="twitter:description" content="全台門市美食團購 LINE 社群入口，附各店地址。點選門市即可加入社群跟團下單。">
    <meta name="twitter:image" content="https://baby03.tw/images/og-image.jpg">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", sans-serif;
            min-height: 100vh;
            /* 2026-08-11 效能：background-attachment:fixed 在手機捲動時每一幀都要重畫滿版背景，
               成本高又常見閃爍，改成只有桌機才 fixed（手機視覺差異極小）。 */
            /* 檔名帶日期是為了繞過 CDN 快取：bg.jpg 重壓後 URL 沒變，
               Cloudflare 邊緣那份舊的 139KB 會繼續服務到過期為止（實測 Age 已 15 小時）。
               換圖時請一併換檔名與下面 DEFAULT_DATA.bg，不要原地覆蓋同一個檔名。 */
            background: url('images/bg-20260811.jpg') no-repeat center center scroll;
            background-size: cover;
            display: flex;
            justify-content: center;
            padding: 16px 12px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }
        .container { max-width:500px; width:100%; text-align:center; padding:20px 0; }
        .logo { width:100%; height:auto; aspect-ratio:1/1; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.2); display:block; margin-bottom:20px; }
        /* 置頂公告：沿用 DEFAULT_DATA.notice，不另開欄位（編輯器本來就能改這句）
           sticky 讓它捲動時黏在畫面頂端；黃底粗字是為了顯眼，但刻意不做成
           漸層膠囊按鈕的樣子，避免客人誤以為可以點 */
        .top-notice {
            position:sticky; top:0; z-index:600;
            background:linear-gradient(135deg,#FFF176,#FFD54F);
            border:2px solid #FFA000; border-radius:14px;
            padding:12px 16px; margin-bottom:12px;
            font-size:15px; font-weight:700; color:#5D4037;
            line-height:1.6; text-align:center; letter-spacing:0.3px;
            box-shadow:0 4px 14px rgba(0,0,0,0.28);
        }
        /* 品牌頭圖：由店面招牌完稿裁出（已去除 QR、板橋宏國店字樣、FB 藍條）
           首頁唯一的 <img>，也是 LCP 元素，故不 lazy、給 fetchpriority=high，
           並用 width/height 佔位避免 CLS */
        .brand-hero {
            display:block; width:100%; height:auto; border-radius:16px;
            margin-bottom:14px; box-shadow:0 3px 12px rgba(0,0,0,0.22);
        }
        .btn-list { display:flex; flex-direction:column; gap:12px; }
        /* 店名與地址上下兩行，包在膠囊內（2026-08-09 業主指定位置）
           2026-08-11：地址要能開地圖，但 <a> 裡不能再放 <a>（非法 HTML），
           且第一版把「整條地址」做成連結後實測會誤點 —— 地址熱區只有 18px 高、298px 寬，
           上下左右緊貼 LINE 熱區、零緩衝（iOS 建議 44x44）。想點地圖點到 LINE、想點 LINE 點到地址。
           改法：地址文字改成「不可點」，地圖入口收斂成右側一顆 44x44 有邊界的按鈕。
             .btn-hit  絕對定位鋪滿整顆膠囊 = 進 LINE 的熱區（Lead 掛這裡）
             .btn-body pointer-events:none → 店名與地址的點擊一律穿透給 LINE
             .btn-map  pointer-events:auto + z-index 3 = 唯一會開地圖的地方
           結果：地圖熱區從 18px 高變成 44x44，LINE 的可點面積反而比上一版更大。 */
        .btn-body { position:relative; z-index:2; pointer-events:none;
                    display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
        .btn-hit { position:absolute; inset:0; z-index:1; border-radius:inherit; }
        .btn-meta { display:grid; grid-template-columns:minmax(0,1fr) 44px;
                    column-gap:8px; align-items:center; min-height:44px; }
        .btn-addr-text {
            font-size:12.5px; font-weight:400; color:#333; line-height:1.35;
            text-align:center; overflow-wrap:anywhere;   /* 置中：沿用 2026-08-09 業主指定 */
        }
        /* 距離是定位後才填入的，未定位時這個 span 是空的，不佔版面 */
        .btn-distance { color:#c2185b; font-weight:700; white-space:nowrap; }
        .btn-map {
            pointer-events:auto; position:relative; z-index:3;
            width:44px; height:44px; border-radius:999px;
            display:inline-flex; align-items:center; justify-content:center;
            border:1px solid rgba(22,101,52,0.28); background:rgba(240,253,244,0.92);
            color:#166534; font-size:12px; font-weight:700; line-height:1;
            text-decoration:none; touch-action:manipulation;
        }
        .btn-map:active { background:#dcf5e3; transform:scale(0.94); }
        /* 鍵盤操作要看得到焦點（LINE 覆蓋層本身沒有文字） */
        .btn-hit:focus-visible, .btn-map:focus-visible { outline:3px solid #1a73e8; outline-offset:2px; }
        @media (max-width:360px) {
            .btn-link { padding:14px 14px; }
            .btn-icon { width:32px; height:32px; margin-right:10px; }
            .btn-text { font-size:15px; }
            .btn-meta { column-gap:6px; }
        }
        /* 定位按鈕：刻意做得比 LINE 膠囊低調，主 CTA 仍是加入社群 */
        .geo-row { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:12px; }
        .geo-btn {
            font-family:inherit; font-size:13.5px; font-weight:600; color:#333;
            background:rgba(255,255,255,0.92); border:none; border-radius:50px;
            padding:9px 18px; cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.18);
        }
        .geo-btn:active { transform:scale(0.97); }
        .geo-btn:disabled { opacity:0.6; cursor:default; }
        /* 狀態文字會壓在淺色背景圖上，純白字不夠清楚 → 給深色小膠囊；沒有訊息時整個不顯示 */
        .geo-status { font-size:12.5px; color:#fff; background:rgba(0,0,0,0.45); border-radius:50px; padding:3px 12px; }
        .geo-status:empty { display:none; }
        .btn-link {
            position:relative;
            display:flex; align-items:center; text-decoration:none;
            background:#fff; border-radius:50px; padding:16px 20px; min-height:56px;
            box-shadow:0 3px 10px rgba(0,0,0,0.15); transition:transform 0.15s,box-shadow 0.15s;
        }
        /* 膠囊本體已改成 div，按壓動畫要跟著覆蓋層的 :active 走；
           舊瀏覽器不支援 :has() 時只是少了按壓動畫，功能不受影響 */
        .btn-link:has(.btn-hit:active) { transform:scale(0.97); background:#f5f5f5; }
        .btn-icon { width:36px; height:36px; margin-right:14px; flex-shrink:0; }
        .btn-text { font-size:16px; font-weight:600; color:#333; text-align:left; line-height:1.4; }
        .btn-line { border-left:5px solid #06C755; }
        .btn-fb   { border-left:5px solid #1877F2; }
        .section-row {
            display:flex; align-items:center; justify-content:center;
            gap:8px; margin:24px 0 12px;
        }
        .section-title {
            color:#fff; font-size:19px; font-weight:700;
            text-shadow:0 2px 6px rgba(0,0,0,0.6); letter-spacing:1px;
        }
        /* 北中南門市格：門市資料仍由 @@DATA 區提供，這裡只定義展示順序與樣式。 */
        .region-count {
            margin:0 0 10px; padding:10px; border-radius:15px;
            background:linear-gradient(110deg,#ffb443,#ff7e31); color:#fff;
            font-size:17px; font-weight:900; letter-spacing:.04em;
            text-align:center; text-shadow:0 2px 2px rgba(155,64,25,.4);
            box-shadow:0 4px 12px rgba(232,119,37,.25);
        }
        .region-section {
            margin:0 0 10px; padding:7px 6px 9px; border-radius:17px;
            border:1px solid var(--region-line); background:var(--region-wash);
        }
        .region-section.north { --region-line:#89c4ff; --region-wash:#eff8ff; --region-head:#428ce3; }
        .region-section.central { --region-line:#ffa6c4; --region-wash:#fff0f6; --region-head:#e52e83; }
        .region-section.south { --region-line:#a8d0ae; --region-wash:#eef7ef; --region-head:#41915c; }
        .region-section.other { --region-line:#d5c4ec; --region-wash:#f3edfc; --region-head:#8349bf; }
        .region-heading {
            width:fit-content; min-width:142px; margin:0 auto 7px; padding:3px 15px;
            border-radius:50px; background:var(--region-head); color:#fff;
            font-size:17px; line-height:1.3; letter-spacing:.14em;
            box-shadow:0 2px 5px rgba(0,0,0,.13);
        }
        .region-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
        .regional-store {
            display:flex; align-items:center; min-width:0; min-height:48px; padding:3px 4px;
            border:1px solid var(--store-border); border-radius:12px;
            background:linear-gradient(180deg,#fff,var(--store-tint)); color:var(--store-ink);
            font-family:inherit; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.08);
        }
        .regional-store:hover { filter:brightness(.97); }
        .regional-store:active { transform:scale(.97); }
        .regional-store:disabled { opacity:.76; cursor:default; filter:grayscale(.3); }
        .regional-store:disabled:active { transform:none; }
        .regional-store:focus-visible { outline:3px solid #186ac7; outline-offset:2px; }
        .regional-store[aria-pressed="true"] { outline:2px solid var(--store-dot); outline-offset:1px; }
        .regional-store.is-featured { border-width:2px; box-shadow:0 3px 12px rgba(233,30,99,.25); }
        .store-ordinal {
            display:grid; place-items:center; flex:0 0 24px; width:24px; height:24px;
            border-radius:50%; background:var(--store-dot); color:#fff; font-size:13px;
            font-weight:800; line-height:1; box-shadow:0 1px 3px rgba(0,0,0,.2);
        }
        .store-label { min-width:0; flex:1; text-align:center; }
        .store-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
            font-size:clamp(10px,3vw,12px); font-weight:750; letter-spacing:-.03em; }
        .store-soon { display:block; color:#935b24; font-size:10px; font-weight:800; line-height:1.1; }
        .store-blue { --store-border:#a6c8ff; --store-tint:#eaf4ff; --store-ink:#1554af; --store-dot:#1265ca; }
        .store-pink { --store-border:#fac5d4; --store-tint:#fff0f3; --store-ink:#c61c5a; --store-dot:#ef3476; }
        .store-green { --store-border:#b7d9c2; --store-tint:#edf8ef; --store-ink:#126546; --store-dot:#23865c; }
        .store-purple { --store-border:#d5c4ec; --store-tint:#f3edfc; --store-ink:#65339b; --store-dot:#8349bf; }
        .store-orange { --store-border:#ffd2a6; --store-tint:#fff3e8; --store-ink:#a95117; --store-dot:#ef751d; }
        .region-hint { margin:10px 5px; color:#fff; font-size:12px; line-height:1.5; text-align:center; text-shadow:0 1px 3px #333; }
        .route-feature {
            display:flex; align-items:center; justify-content:space-between; gap:10px;
            margin:0 0 12px; padding:12px 14px; border:2px solid #e91e63; border-radius:16px;
            background:linear-gradient(120deg,#fff 10%,#fff0f5); text-align:left;
            box-shadow:0 4px 16px rgba(233,30,99,.25);
        }
        .route-feature-copy { min-width:0; }
        .route-feature-label { display:block; color:#9c1742; font-size:11px; font-weight:800; }
        .route-feature-name { display:block; color:#333; font-size:17px; font-weight:900; }
        .route-feature-actions { display:flex; flex-shrink:0; gap:6px; }
        .route-feature-actions a { display:inline-flex; align-items:center; justify-content:center; min-height:42px;
            padding:7px 10px; border-radius:10px; font-size:12px; font-weight:800; text-decoration:none; }
        .route-feature-line { background:#06c755; color:#073d1a; }
        .route-feature-map { border:1px solid #77b68b; background:#f0fdf4; color:#166534; }
        .detail-panel { margin:13px 0 16px; border-radius:22px; background:#fff; color:#273244; box-shadow:0 4px 18px rgba(0,0,0,.14); }
        .detail-content { padding:18px; text-align:left; }
        .detail-head { display:flex; align-items:flex-start; gap:12px; }
        .detail-number { display:grid; place-items:center; flex:0 0 34px; width:34px; height:34px;
            border-radius:50%; background:#2065bd; color:#fff; font-weight:800; }
        .detail-head h2 { margin:1px 0 2px; color:#273244; font-size:20px; }
        .detail-content p { margin:5px 0; color:#4f5661; font-size:14px; line-height:1.55; overflow-wrap:anywhere; }
        .detail-content .detail-distance { color:#b71657; font-weight:700; }
        .detail-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
        .detail-actions a { display:flex; align-items:center; justify-content:center; gap:7px; min-height:48px;
            padding:8px; border-radius:12px; font-weight:700; text-decoration:none; }
        .detail-line { background:#06c755; color:#073d1a; }
        .detail-map { border:1px solid #77b68b; background:#f0fdf4; color:#166534; }
        .store-distance { display:block; margin-top:1px; font-size:10px; }
        @media (max-width:340px) {
            .region-grid { gap:3px; }
            .regional-store { padding:3px 2px; }
            .store-ordinal { flex-basis:22px; width:22px; height:22px; font-size:12px; }
            .route-feature { gap:6px; padding:10px; }
            .route-feature-name { font-size:15px; }
            .route-feature-actions a { padding:6px; font-size:11px; }
        }
        .info-card {
            background:rgba(255,255,255,0.95); border-radius:16px;
            padding:24px 20px; margin-bottom:8px;
            box-shadow:0 3px 10px rgba(0,0,0,0.15); text-align:left;
        }
        .info-card h1 { font-size:24px; color:#333; text-align:center; margin-bottom:8px; }
        .info-card .subtitle { font-size:15px; color:#666; text-align:center; margin-bottom:20px; line-height:1.7; }
        .info-card h2 { font-size:17px; color:#333; margin:18px 0 10px; }
        .info-card ul { list-style:none; padding:0; }
        .info-card ul li { font-size:15px; color:#444; padding:5px 0; line-height:1.6; }
        .info-card .notice { font-size:14px; color:#666; line-height:1.7; margin-top:6px; }
        .icon-line { background:#06C755; border-radius:8px; padding:5px; }
        .icon-fb   { background:#1877F2; border-radius:8px; padding:5px; }

        /* ── Featured store ── */
        .btn-featured {
            transform:scale(1.04); position:relative;
            box-shadow:0 4px 20px rgba(233,30,99,0.35) !important;
            border-left-width:6px !important;
        }
        .featured-badge {
            /* 徽章有一半凸出膠囊上緣，那一塊不在 .btn-hit 的覆蓋範圍內；
               不設 pointer-events:none 的話，點到徽章會變成沒反應的死角 */
            pointer-events:none;
            position:absolute; top:-9px; right:12px;
            background:linear-gradient(135deg,#ff6b9d,#e91e63);
            color:#fff; font-size:11px; font-weight:700;
            padding:2px 10px; border-radius:10px; white-space:nowrap;
        }
        .btn-secondary { opacity:0.65; transform:scale(0.96); }

        /* ── Hot deals banner ── */
        .hot-deals-btn {
            display:block; text-align:center; text-decoration:none;
            background:linear-gradient(135deg,#ff6b35,#e91e63);
            color:#fff; font-size:17px; font-weight:700;
            padding:16px 20px; border-radius:16px; margin-bottom:16px;
            box-shadow:0 4px 16px rgba(233,30,99,0.4);
            transition:transform 0.15s;
            animation:hotPulse 2s ease-in-out infinite;
        }
        .hot-deals-btn:active { transform:scale(0.97); }
        @keyframes hotPulse {
            0%,100% { box-shadow:0 4px 16px rgba(233,30,99,0.4); }
            50% { box-shadow:0 6px 28px rgba(233,30,99,0.7); }
        }

        /* ── Floating widgets ── */
        .float-widgets {
            position:fixed; bottom:22px; right:14px; z-index:500;
            display:flex; flex-direction:column; gap:10px; align-items:flex-end;
        }
        .float-btn {
            display:flex; align-items:center; gap:8px;
            color:#fff; border-radius:50px;
            padding:12px 20px; font-size:15px; font-weight:700;
            font-family:inherit; text-decoration:none; white-space:nowrap;
            transition:transform 0.15s, box-shadow 0.15s;
        }
        .float-btn:active { transform:scale(0.97); }
        .float-btn svg { width:22px; height:22px; flex-shrink:0; }
        .float-btn.messenger {
            background:linear-gradient(135deg,#8a3ab9,#0084ff);
            box-shadow:0 4px 16px rgba(0,132,255,0.45);
        }
        .float-btn.messenger:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,132,255,0.6); }
        .float-btn.iplusone {
            background:linear-gradient(135deg,#ff6b9d,#e91e63);
            box-shadow:0 4px 16px rgba(233,30,99,0.45);
        }
        .float-btn.iplusone:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(233,30,99,0.6); }
        .float-btn.costco {
            background:linear-gradient(135deg,#E4002B,#B8001F);
            box-shadow:0 4px 16px rgba(228,0,43,0.45);
        }
        .float-btn.costco:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(228,0,43,0.6); }

        @media(min-width:769px){
            body { background-attachment:fixed; }
        }
        @media(min-width:600px){
            body { padding:30px 20px; }
            .btn-link:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(0,0,0,0.25); }
        }
    </style>

function routedStoreIndex() {
    try {
        const p = new URLSearchParams(location.search);
        const hay = ((p.get('utm_campaign') || '') + ' ' + (p.get('utm_content') || '')).toLowerCase();
        if (!hay.trim()) return -1;
        for (const r of STORE_ROUTES) {
            if (r.rx.test(hay)) {
                const idx = (D.sec1 || []).findIndex(b => (b.label || '').includes(r.key));
                if (idx >= 0) return idx;
            }
        }
    } catch (e) {}
    return -1;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl2br(s) { return esc(s).replace(/\n/g,'<br>'); }

function buildBtns(sec) {
    // utm 命中 → 對應店置頂，featured/keepBright 對準新順序第 0 位；否則落回 DEFAULT 設定
    let items = D[sec] || [];
    let fi, keepBright;
    if (sec === 'sec1' && ROUTED_KEY === '內湖') {
        // 內湖廣告頁：內湖唯一放大、士林維持正常；板橋／三重起與榮華同為次要樣式。
        const rank = ['內湖', '士林葫東', '板橋宏國', '三重大有', '桃園榮華'];
        items = [
            ...rank.map(k => D.sec1.find(b => (b.label || '').includes(k))).filter(Boolean),
            ...D.sec1.filter(b => !rank.some(k => (b.label || '').includes(k)))
        ];
        fi = 0;
        keepBright = [1];
    } else if (sec === 'sec1' && ROUTED_IDX >= 0) {
        items = [D.sec1[ROUTED_IDX], ...D.sec1.filter((_, i) => i !== ROUTED_IDX)];
        fi = 0;
        keepBright = [0];
    } else {
        fi = (sec === 'sec1' && typeof D.featuredStore === 'number' && D.featuredStore >= 0) ? D.featuredStore : -1;
        keepBright = (sec === 'sec1' && Array.isArray(D.featuredKeepBright)) ? D.featuredKeepBright : [];
    }
    // sec2 的【美食團購】FB 社團：utm 命中士林/榮華/內湖 → 換成該店專屬社團（按鈕文字維持共用短名）。
    // ❗ 必須同時比 t==='fb' 與 label 含「美食團購」—— sec2 有兩顆 FB，
    //    只看 t==='fb' 會把【童裝女裝用品】臉書社團（全站共用）一起改掉。
    const fbGroup = (sec === 'sec2') ? STORE_FB_GROUPS[ROUTED_KEY] : null;
    if (fbGroup) {
        items = items.map(b => (b && b.t === 'fb' && (b.label || '').includes('美食團購'))
            ? { ...b, url: fbGroup.url }
            : b);
    }
    return items.map((b, i) => {
        const icon = b.t === 'line' ? LINE_ICON : FB_ICON;
        const cls  = b.t === 'line' ? 'btn-line' : 'btn-fb';
        const isFeatured = sec === 'sec1' && i === fi;
        const isBright = isFeatured || keepBright.includes(i);
        const isDim = fi >= 0 && sec === 'sec1' && !isBright;
        const extra = isFeatured ? ' btn-featured' : (isDim ? ' btn-secondary' : '');
        const badge = isFeatured ? '<span class="featured-badge">⭐ 主力推薦</span>' : '';
        const storeMatch = (b.label || '').match(/【([^】]+)】/);
        const store = storeMatch ? storeMatch[1] : 'unknown';
        const channel = b.t === 'line' ? 'line_openchat' : 'fb_group';
        const addr = (b.addr || '').trim();
        // 有座標就用座標開地圖（門牌最準）；沒有就退回地址字串讓 Google 自己找。
        // 例：三重店地址寫「大有街1之12號」，Google 會解析成 1之35號，差一個門牌 —— 所以座標優先。
        const hasGeo = typeof b.lat === 'number' && typeof b.lng === 'number';
        const mapQuery = hasGeo ? `${b.lat},${b.lng}` : addr;
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery)}`;
        const geoAttr = hasGeo ? ` data-lat="${b.lat}" data-lng="${b.lng}"` : '';
        // 地址文字是純文字（不可點），只有右邊那顆 .btn-map 會開地圖。
        // data-map-link 是給 Pixel 監聽用的排除標記，不可拿掉（見檔尾 click listener）
        const mapLine = addr ? `<span class="btn-meta">
                <span class="btn-addr-text">📍${esc(addr)}<span class="btn-distance"${geoAttr}></span></span>
                <a class="btn-map" href="${esc(mapUrl)}" target="_blank" rel="noopener"
                   aria-label="在地圖開啟 ${esc(store)}：${esc(addr)}"
                   data-map-link="1"
                   data-store="${esc(store)}">地圖</a>
            </span>` : '';
        // data-fb-event 只掛在 .btn-hit，不可往外層搬 —— 搬到 .btn-link 上，
        // 地址連結的 closest('[data-fb-event]') 就會命中外層，地圖點擊又會被算成 Lead。
        return `<div class="btn-link ${cls}${extra}">
            <a class="btn-hit" href="${esc(b.url)}" target="_blank"
            aria-label="${esc(b.label)}"
            data-fb-event="Lead"
            data-store="${esc(store)}"
            data-channel="${channel}"
            data-button="${esc(b.label)}"></a>
            ${icon}<span class="btn-body"><span class="btn-text">${esc(b.label)}</span>${mapLine}</span>${badge}
        </div>`;
    }).join('');
}

function regionalSource(store) {
    if (store.status) return null;
    return (D.sec1 || []).find(b => {
        const match = (b.label || '').match(/【([^】]+)】/);
        return match && match[1] === store.name;
    }) || null;
}

function regionalEntries() {
    const entries = STORE_LAYOUT.map((store, layoutIndex) => {
        const source = regionalSource(store);
        return { store, source, dataIndex: source ? D.sec1.indexOf(source) : -1, layoutIndex, isExtra: false };

    const represented = new Set(entries.map(entry => entry.source).filter(Boolean));

    (D.sec1 || []).forEach((source, dataIndex) => {
        const match = (source.label || '').match(/【([^】]+)】/);

            key: match[1].replace(/店$/, ''),
            name: match[1],
            region: '其他門市',
            color: colors[(layoutIndex - STORE_LAYOUT.length) % colors.length]
        };
        entries.push({ store, source, dataIndex, layoutIndex, isExtra: true });
    });
    return entries;
}

function regionalMapUrl(store) {
    const hasGeo = typeof store.lat === 'number' && typeof store.lng === 'number';
    const query = hasGeo ? `${store.lat},${store.lng}` : (store.addr || '').trim();
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

function renderRegionalGrid(region, id, className) {
    const entries = STORE_LAYOUT.map((store, layoutIndex) => ({ store, layoutIndex }))
        .filter(({ store }) => store.region === region);
    const cards = entries.map(({ store, layoutIndex }) => {
        const source = regionalSource(store);
        const dataIndex = source ? D.sec1.indexOf(source) : -1;
        const featured = dataIndex >= 0 && (dataIndex === ROUTED_IDX || (ROUTED_IDX < 0 && dataIndex === D.featuredStore));
        const distance = source && typeof source.lat === 'number' && typeof source.lng === 'number'
            ? `<span class="btn-distance store-distance" data-lat="${source.lat}" data-lng="${source.lng}"></span>` : '';
        const label = source ? '查看門市資訊' : store.status;
        return `<button type="button" class="regional-store store-${store.color}${featured ? ' is-featured' : ''}"
                    data-store-index="${layoutIndex}" aria-label="第${layoutIndex + 1}間，${esc(store.name)}，${esc(label)}"
                    aria-pressed="false"${store.status ? ' disabled' : ''}>
                    <span class="store-ordinal">${layoutIndex + 1}</span>
                    <span class="store-label"><span class="store-name">${esc(store.name)}</span>${store.status ? `<small class="store-soon">${esc(store.status)}</small>` : distance}</span>
                </button>`;
    }).join('');
    return `<section class="region-section ${className}" id="${id}" aria-labelledby="${id}-title">
        <h2 class="region-heading" id="${id}-title">${region}</h2><div class="region-grid">${cards}</div>
    </section>`;
}

function routeFeatureMarkup() {
    if (ROUTED_IDX < 0) return '';
    const source = D.sec1[ROUTED_IDX];
    const match = (source.label || '').match(/【([^】]+)】/);
    const storeName = match ? match[1] : '指定門市';
    const mapUrl = regionalMapUrl(source);
    return `<aside class="route-feature" aria-label="廣告指定門市">
        <div class="route-feature-copy"><span class="route-feature-label">廣告指定門市</span><strong class="route-feature-name">${esc(storeName)}</strong></div>
        <div class="route-feature-actions">
            <a class="route-feature-line" href="${esc(source.url)}" target="_blank" rel="noopener"
               data-fb-event="Lead" data-store="${esc(storeName)}" data-channel="line_openchat" data-button="${esc(source.label)}">加入 LINE</a>
            <a class="route-feature-map" href="${esc(mapUrl)}" target="_blank" rel="noopener" data-map-link="1" data-store="${esc(storeName)}">地圖</a>
        </div>
    </aside>`;
}

function renderOtherStores() {
    const extras = regionalEntries().filter(entry => entry.isExtra);
    if (!extras.length) return '';
    const cards = extras.map(({ store, source, dataIndex, layoutIndex }) => {
        const featured = dataIndex === ROUTED_IDX || (ROUTED_IDX < 0 && dataIndex === D.featuredStore);
        const hasGeo = typeof source.lat === 'number' && typeof source.lng === 'number';
        const distance = hasGeo
            ? `<span class="btn-distance store-distance" data-lat="${source.lat}" data-lng="${source.lng}"></span>` : '';
        return `<button type="button" class="regional-store store-${store.color}${featured ? ' is-featured' : ''}"
                    data-store-index="${layoutIndex}" aria-label="第${layoutIndex + 1}間，${esc(store.name)}，查看門市資訊"
                    aria-pressed="false">
                    <span class="store-ordinal">${layoutIndex + 1}</span>
                    <span class="store-label"><span class="store-name">${esc(store.name)}</span>${distance}</span>
                </button>`;
    }).join('');
    return `<section class="region-section other" id="other-stores" aria-labelledby="other-stores-title">
        <h2 class="region-heading" id="other-stores-title">其他門市</h2><div class="region-grid">${cards}</div>
    </section>`;
}

function showRegionalStore(index) {
    const entry = regionalEntries()[index];
    const store = entry && entry.store;
    const source = entry && entry.source;
    if (!source) return;
    selectedStoreIndex = index;
    document.querySelectorAll('.regional-store').forEach(button =>
        button.setAttribute('aria-pressed', String(Number(button.dataset.storeIndex) === index)));
    document.getElementById('detail-number').textContent = index + 1;
    document.getElementById('detail-title').textContent = store.name;
    document.getElementById('detail-region').textContent = store.region;
    document.getElementById('detail-address').textContent = `📍 ${source.addr || ''}`;
    const distance = document.getElementById('detailDistance');
    const hasGeo = typeof source.lat === 'number' && typeof source.lng === 'number';
    distance.textContent = lastGeoPosition && hasGeo
        ? `直線${formatDistance(haversineKm(lastGeoPosition.latitude, lastGeoPosition.longitude, source.lat, source.lng))}（非車程）`
        : '點擊上方定位按鈕可查直線距離（非車程）';
    const line = document.getElementById('detailLine');
    line.href = source.url;
    line.dataset.store = store.name;
    line.dataset.button = source.label || '';
    line.setAttribute('aria-label', `${store.name}加入 LINE 社群`);
    const map = document.getElementById('detailMap');
    map.href = regionalMapUrl(source);
    map.dataset.store = store.name;
}

function initRegionalStores() {
    document.querySelectorAll('.regional-store:not(:disabled)').forEach(button => {
        button.addEventListener('click', () => {
            showRegionalStore(Number(button.dataset.storeIndex));
            const detail = document.getElementById('selected-store');
            const notice = document.querySelector('.top-notice');
            const noticeOffset = notice ? Math.ceil(notice.getBoundingClientRect().height) + 12 : 12;
            detail.style.scrollMarginTop = `${noticeOffset}px`;
            detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    });
    const entries = regionalEntries();
    const routedLayoutIndex = ROUTED_IDX >= 0
        ? entries.findIndex(entry => entry.source && entry.dataIndex === ROUTED_IDX)
        : -1;
    const featuredLayoutIndex = entries.findIndex(entry => entry.dataIndex === D.featuredStore && entry.source);
    showRegionalStore(routedLayoutIndex >= 0 ? routedLayoutIndex : featuredLayoutIndex >= 0 ? featuredLayoutIndex : 0);
}

// 平台偵測：Android 用 intent://，iOS 用 m.me（Universal Link），桌面新分頁
function openMessenger(e, url) {
    const m = url.match(/m\.me\/([^?\/#]+)/);
    if (!m) return true; // 非 m.me 連結，讓瀏覽器預設處理
    e.preventDefault();
    const username = m[1];
    const ua = navigator.userAgent;
    if (/Android/i.test(ua)) {
        window.location.href = `intent://user/${username}#Intent;scheme=fb-messenger;package=com.facebook.orca;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    } else if (/iPad|iPhone|iPod/.test(ua)) {
        window.location.href = url;
    } else {
        window.open(url, '_blank');
    }
    return false;
}

// ── 距離顯示（2026-08-11 試做）────────────────────────────────────────
// 只做「直線距離」：站上沒有路線 API，也刻意不接（靜態頁放 API key 有風險）。
// 文案一律標「直線」，不可寫成車程或路線距離。
// 距離只是資訊，不動排序 —— 置頂/⭐主力推薦是業主指定的商業規則（utm 分流 + featuredStore）。
function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function formatDistance(km) {
    if (!isFinite(km) || km < 0) return '';
    if (km < 0.1) return '約 100m 內';
    if (km < 1) {
        const m = Math.round(km * 10) * 100;
        // 0.96km 這種會被進位成 1000m，改用公里表示，不要出現「約 1000m」
        return m >= 1000 ? '約 1.0km' : `約 ${m}m`;
    }
    if (km < 10) {
        const one = km.toFixed(1);
        // 9.96 會被 toFixed 進位成 10.0，和 10km 以上的整數格式不一致 → 交給下面的整數分支
        if (one !== '10.0') return `約 ${one}km`;
    }
    return `約 ${Math.round(km)}km`;
}

// 只更新距離文字；沒有 lat/lng 的門市（例如日後用編輯器新增的店）就保持空白，不影響地圖按鈕
function renderDistances(lat, lng) {
    lastGeoPosition = { latitude: lat, longitude: lng };
    let n = 0;
    document.querySelectorAll('.btn-distance[data-lat][data-lng]').forEach(function(box) {
        const sLat = parseFloat(box.dataset.lat);
        const sLng = parseFloat(box.dataset.lng);
        if (!isFinite(sLat) || !isFinite(sLng)) return;
        const txt = formatDistance(haversineKm(lat, lng, sLat, sLng));
        if (!txt) return;
        box.textContent = ` · 直線${txt}`;
        n++;
    });
    const current = regionalEntries()[selectedStoreIndex]?.source;
    const detailDistance = document.getElementById('detailDistance');
    if (current && detailDistance && typeof current.lat === 'number' && typeof current.lng === 'number') {
        detailDistance.textContent = `直線${formatDistance(haversineKm(lat, lng, current.lat, current.lng))}（非車程）`;
    }
    return n;
}

// 一律由使用者按按鈕才定位。落地頁一進站就跳系統權限對話框會嚇跑客人，直接影響加入社群的轉換。
function initGeo() {
    const btn = document.getElementById('locateBtn');
    const st  = document.getElementById('geoStatus');
    if (!btn || !st) return;
    btn.addEventListener('click', function() {
        if (!navigator.geolocation) { st.textContent = '此瀏覽器不支援定位，仍可點「地圖」按鈕'; return; }
        btn.disabled = true;
        st.textContent = '定位中…';
        let settled = false;
        // 看門狗：getCurrentPosition 的 timeout 依規格「不包含等待使用者授權的時間」，
        // 實測 Chrome 在權限對話框沒被回答時，8 秒 timeout 永遠不會觸發 →
        // 按鈕會一直卡在 disabled + 「定位中…」。這支計時器只負責把介面解鎖，
        // 不取消底下那個請求（使用者稍後才按允許的話，距離仍然會補上）。
        const watchdog = setTimeout(function() {
            if (settled) return;
            btn.disabled = false;
            st.textContent = '還在等定位授權，可先點「地圖」按鈕';
        }, 12000);
        const finish = function(text) {
            settled = true;
            clearTimeout(watchdog);
            btn.disabled = false;
            st.textContent = text;
        };
        navigator.geolocation.getCurrentPosition(function(pos) {
            const n = renderDistances(pos.coords.latitude, pos.coords.longitude);
            finish(n > 0 ? '已顯示直線距離（非車程）' : '目前沒有可計算距離的門市');
        }, function() {
            // 拒絕授權／逾時／非 HTTPS 都走這裡，頁面其餘功能不受影響
            finish('無法取得定位，仍可點「地圖」按鈕');
        }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
    });
}

render();
initGeo();

// Meta Pixel 按鈕點擊事件追蹤（fire-and-forget，不阻擋跳轉）
document.addEventListener('click', function(e) {
    // 地圖按鈕不是轉換：.btn-map 與帶 data-fb-event 的 .btn-hit 是兄弟節點，
    // 本來就不會被 closest 抓到；這行是第二道保險，
    // 避免日後有人把 data-fb-event 搬到外層膠囊就無聲灌水 Lead。
    if (e.target.closest('[data-map-link]')) return;
    const a = e.target.closest('[data-fb-event]');
    if (!a) return;
    if (typeof fbq !== 'function') return;
    try {
        const urlParams = new URLSearchParams(location.search);
        fbq('track', a.dataset.fbEvent, {
            button_name: a.dataset.button || '',
            store: a.dataset.store || '',
            channel: a.dataset.channel || '',
            target_url: a.href || '',
            page_url: location.href,
            campaign: urlParams.get('utm_campaign') || 'organic',
            adset_id: urlParams.get('utm_adset') || '',
            ad_id: urlParams.get('utm_ad') || '',
            utm_content: urlParams.get('utm_content') || '',
            utm_term: urlParams.get('utm_term') || '',
            route_store: (ROUTED_IDX >= 0 && D.sec1[ROUTED_IDX]) ? (((D.sec1[ROUTED_IDX].label || '').match(/【([^】]+)】/) || [])[1] || '') : '',
            route_source: ROUTED_IDX >= 0 ? 'utm' : 'default'
        });
    } catch (err) { /* fail-safe: Pixel 異常不影響跳轉 */ }
}, true);
