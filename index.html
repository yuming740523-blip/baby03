        .btn-list { display:flex; flex-direction:column; gap:12px; }
        .btn-link {
            display:flex; align-items:center; text-decoration:none;
            background:#fff; border-radius:50px; padding:16px 20px; min-height:56px;
            box-shadow:0 3px 10px rgba(0,0,0,0.15); transition:transform 0.15s,box-shadow 0.15s;

        .btn-link:active { transform:scale(0.97); background:#f5f5f5; }
        .btn-icon { width:36px; height:36px; margin-right:14px; flex-shrink:0; }
        .btn-text { font-size:16px; font-weight:600; color:#333; text-align:left; line-height:1.4; flex:1; }
        .btn-line { border-left:5px solid #06C755; }
        .btn-fb   { border-left:5px solid #1877F2; }
        .section-row {
            display:flex; align-items:center; justify-content:center;
            gap:8px; margin:24px 0 12px;
        }
        .section-title {
            color:#fff; font-size:19px; font-weight:700;
            text-shadow:0 2px 6px rgba(0,0,0,0.6); letter-spacing:1px;
        }
        .info-card {
            background:rgba(255,255,255,0.95); border-radius:16px;

            box-shadow:0 3px 10px rgba(0,0,0,0.15); text-align:left;

        .info-card .subtitle { font-size:15px; color:#666; text-align:center; margin-bottom:20px; line-height:1.7; }
        .info-card h2 { font-size:17px; color:#333; margin:18px 0 10px; }

        .info-card ul li { font-size:15px; color:#444; padding:5px 0; line-height:1.6; }
        .info-card .notice { font-size:14px; color:#666; line-height:1.7; margin-top:6px; }
        .icon-line { background:#06C755; border-radius:8px; padding:5px; }
        .icon-fb   { background:#1877F2; border-radius:8px; padding:5px; }

        /* ── Featured store ── */
        .btn-featured {
            transform:scale(1.04); position:relative;
            box-shadow:0 4px 20px rgba(233,30,99,0.35) !important;
            border-left-width:6px !important;
        }
        .featured-badge {
            position:absolute; top:-9px; right:12px;
            background:linear-gradient(135deg,#ff6b9d,#e91e63);
            color:#fff; font-size:11px; font-weight:700;
            padding:2px 10px; border-radius:10px; white-space:nowrap;
        }
        .btn-secondary { opacity:0.65; transform:scale(0.96); }

        /* ── Hot deals banner ── */
        .hot-deals-btn {
            display:block; text-align:center; text-decoration:none;
            background:linear-gradient(135deg,#ff6b35,#e91e63);
            color:#fff; font-size:17px; font-weight:700;
            padding:16px 20px; border-radius:16px; margin-bottom:16px;
            box-shadow:0 4px 16px rgba(233,30,99,0.4);
            transition:transform 0.15s;
            animation:hotPulse 2s ease-in-out infinite;
        }
        .hot-deals-btn:active { transform:scale(0.97); }
        @keyframes hotPulse {
            0%,100% { box-shadow:0 4px 16px rgba(233,30,99,0.4); }
            50% { box-shadow:0 6px 28px rgba(233,30,99,0.7); }
        }

        /* ── Floating widgets ── */
        .float-widgets {
            position:fixed; bottom:22px; right:14px; z-index:500;
            display:flex; flex-direction:column; gap:10px; align-items:flex-end;
        }
        .float-btn {
            display:flex; align-items:center; gap:8px;
            color:#fff; border-radius:50px;
            padding:12px 20px; font-size:15px; font-weight:700;
            font-family:inherit; text-decoration:none; white-space:nowrap;
            transition:transform 0.15s, box-shadow 0.15s;
        }
        .float-btn:active { transform:scale(0.97); }
        .float-btn svg { width:22px; height:22px; flex-shrink:0; }
        .float-btn.messenger {
            background:linear-gradient(135deg,#8a3ab9,#0084ff);
            box-shadow:0 4px 16px rgba(0,132,255,0.45);
        }
        .float-btn.messenger:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,132,255,0.6); }
        .float-btn.iplusone {
            background:linear-gradient(135deg,#ff6b9d,#e91e63);

        }
        .float-btn.iplusone:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(233,30,99,0.6); }
        .float-btn.costco {
            background:linear-gradient(135deg,#E4002B,#B8001F);

        }
        .float-btn.costco:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(228,0,43,0.6); }

        @media(min-width:600px){
            body { padding:30px 20px; }
            .btn-link:hover { transform:translateY(-2px); box-shadow:0 5px 20px rgba(0,0,0,0.25); }

const D = DEFAULT_DATA;

// ── utm → 店別分流（廣告已帶 utm_campaign=banqiao_*/sanchong_*，毋須改廣告）──
// 讀 utm_campaign / utm_content，命中店別關鍵字 → 該店置頂+高亮、其餘淡化仍可點；不 auto-open。
const STORE_ROUTES = [
    // ⚠️ 例外規則必須排在通則之前（先命中先贏）
    // 2026-08-08：士林「舊貼文社群證明測試」廣告引用 2022 年相簿貼文（2,899 讚 / 249 留言 / 183 分享）。
    // 該貼文的行動呼籲按鈕連結被 Meta 鎖死為 utm_campaign=sanchong_1150701（7/01 三重檔期留下），
    // 三種改法皆失敗：API 不收 call_to_action 欄位／粉專貼文不顯示該按鈕／廣告管理員回
    // 「至少一則其他正在刊登中的廣告使用了該貼文…請為此廣告建立新貼文」。
    // 查證：全帳號 573 支廣告無人使用此 utm 值、5 個三重 campaign 全部 PAUSED → 此值已閒置，
    // 故在站端精準比對改導士林，避免士林客人點進來看到三重被置頂。
    // ⛔ 若日後重啟三重且沿用 sanchong_1150701，必須先移除本行。
    { rx: /sanchong_1150701/i, key: '士林葫東' },
    // 2026-08-09：桃園榮華新店。刻意不加 /taoyuan|桃園/ 通則 —— 桃園有榮華、蓮埔兩店，
    // 通則會讓其中一店吃掉另一店的流量；廣告 utm 必須寫 ronghua 或 lianpu 才會命中。
    { rx: /ronghua|榮華/i,  key: '桃園榮華' },
    { rx: /banqiao|板橋/i,  key: '板橋宏國' },
    { rx: /sanchong|三重/i, key: '三重大有' },
    { rx: /bade|八德/i,     key: '八德金和' },
    { rx: /lianpu|蓮埔/i,   key: '桃園蓮埔' },
    { rx: /zhongli|中壢/i,  key: '中壢環北' },
    { rx: /miaoli|苗栗/i,   key: '苗栗國華' },
    { rx: /shilin|士林/i,   key: '士林葫東' }
];
function routedStoreIndex() {
    try {
        const p = new URLSearchParams(location.search);
        const hay = ((p.get('utm_campaign') || '') + ' ' + (p.get('utm_content') || '')).toLowerCase();
        if (!hay.trim()) return -1;
        for (const r of STORE_ROUTES) {
            if (r.rx.test(hay)) {
                const idx = (D.sec1 || []).findIndex(b => (b.label || '').includes(r.key));
                if (idx >= 0) return idx;
            }
        }
    } catch (e) {}
    return -1;
}
const ROUTED_IDX = routedStoreIndex();   // -1 = 無 utm 命中 → 落回 DEFAULT_DATA.featuredStore

const LINE_ICON = `<svg class="btn-icon icon-line" viewBox="0 0 32 32" fill="white"><path d="M16 3C8.82 3 3 7.95 3 13.93c0 5.12 4.55 9.42 10.7 10.84.41.09.98.28 1.12.64.13.33.08.84.04 1.17l-.18 1.08c-.06.33-.26 1.28 1.12.7s7.44-4.38 10.16-7.5C28.28 18.22 29 16.17 29 13.93 29 7.95 23.18 3 16 3zm-4.5 14.5h-3a.75.75 0 01-.75-.75v-5a.75.75 0 011.5 0v4.25h2.25a.75.75 0 010 1.5zm2.5-.75a.75.75 0 01-1.5 0v-5a.75.75 0 011.5 0v5zm5.5 0a.75.75 0 01-1.35.45L15.5 13.6v3.15a.75.75 0 01-1.5 0v-5a.75.75 0 011.35-.45l2.65 3.6V11.75a.75.75 0 011.5 0v5zm4-3.5h-2.25v-1.5h2.25a.75.75 0 010 1.5zm0 3.5h-3a.75.75 0 01-.75-.75v-5a.75.75 0 01.75-.75h3a.75.75 0 010 1.5h-2.25v1h2.25a.75.75 0 010 1.5h-2.25v1h2.25a.75.75 0 010 1.5z"/></svg>`;
const FB_ICON  = `<svg class="btn-icon icon-fb"   viewBox="0 0 32 32" fill="white"><path d="M29 16C29 8.82 23.18 3 16 3S3 8.82 3 16c0 6.49 4.75 11.87 10.97 12.84v-9.08h-3.3V16h3.3v-2.87c0-3.26 1.94-5.06 4.91-5.06 1.42 0 2.91.25 2.91.25v3.2h-1.64c-1.61 0-2.12 1-2.12 2.03V16h3.61l-.58 3.76h-3.03v9.08C24.25 27.87 29 22.49 29 16z"/></svg>`;

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl2br(s) { return esc(s).replace(/\n/g,'<br>'); }

function buildBtns(sec) {
    // utm 命中 → 對應店置頂，featured/keepBright 對準新順序第 0 位；否則落回 DEFAULT 設定
    let items = D[sec] || [];
    let fi, keepBright;
    if (sec === 'sec1' && ROUTED_IDX >= 0) {
        items = [D.sec1[ROUTED_IDX], ...D.sec1.filter((_, i) => i !== ROUTED_IDX)];
        fi = 0;
        keepBright = [0];
    } else {
        fi = (sec === 'sec1' && typeof D.featuredStore === 'number' && D.featuredStore >= 0) ? D.featuredStore : -1;
        keepBright = (sec === 'sec1' && Array.isArray(D.featuredKeepBright)) ? D.featuredKeepBright : [];
    }
    return items.map((b, i) => {
        const icon = b.t === 'line' ? LINE_ICON : FB_ICON;
        const cls  = b.t === 'line' ? 'btn-line' : 'btn-fb';
        const isFeatured = sec === 'sec1' && i === fi;
        const isBright = isFeatured || keepBright.includes(i);
        const extra = isFeatured ? ' btn-featured' : (fi >= 0 && sec === 'sec1' && !isBright ? ' btn-secondary' : '');
        const badge = isFeatured ? '<span class="featured-badge">⭐ 主力推薦</span>' : '';
        const storeMatch = (b.label || '').match(/【([^】]+)】/);
        const store = storeMatch ? storeMatch[1] : 'unknown';
        const channel = b.t === 'line' ? 'line_openchat' : 'fb_group';
        return `<a class="btn-link ${cls}${extra}" href="${esc(b.url)}" target="_blank"
            data-fb-event="Lead"
            data-store="${esc(store)}"
            data-channel="${channel}"
            data-button="${esc(b.label)}">
            ${icon}<span class="btn-text">${esc(b.label)}</span>${badge}
        </a>`;
    }).join('');
}

function render() {
    document.body.style.backgroundImage = `url('${D.bg}')`;
    // 首頁頂部大圖 2026-06-10 業主指示移除；DATA.logo 保留，要復原把原 <picture> 區塊（webp source + img.logo）加回即可
    document.getElementById('app').innerHTML = `
    <div class="info-card">
        <h1>${esc(D.cardTitle)}</h1>
        <div class="subtitle">${nl2br(D.cardSubtitle)}</div>
        <h2>${esc(D.serviceTitle)}</h2>
        <ul>${D.services.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
        <h2>${esc(D.noticeTitle)}</h2>
        <div class="notice">${nl2br(D.notice)}</div>
    </div>
    ${D.hotDeals && D.hotDeals.on ? `<a class="hot-deals-btn" href="${esc(D.hotDeals.url)}" target="_blank">${esc(D.hotDeals.text)}</a>` : ''}
    <div class="section-row"><div class="section-title">${esc(D.sec1Title)}</div></div>
    <div class="btn-list">${buildBtns('sec1')}</div>
    <div class="section-row"><div class="section-title">${esc(D.sec2Title)}</div></div>
    <div class="btn-list">${buildBtns('sec2')}</div>`;

    let floatBtns = '';
    if (D.widget && D.widget.on) {
        floatBtns += `<a class="float-btn messenger" href="${esc(D.widget.url)}" onclick="return openMessenger(event,this.href)">
            <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.477 2 2 6.145 2 11.259c0 2.84 1.317 5.38 3.396 7.106V22l3.086-1.697c.824.228 1.698.351 2.603.351 5.523 0 10-4.145 10-9.259C21.085 6.145 17.523 2 12 2zm1.02 12.476l-2.55-2.72-4.976 2.72 5.476-5.816 2.613 2.72 4.913-2.72-5.476 5.816z"/></svg>
            ${esc(D.widget.text)}
        </a>`;
    }
    if (D.widget2 && D.widget2.on) {
        floatBtns += `<a class="float-btn iplusone" href="${esc(D.widget2.url)}" target="_blank">
            <svg viewBox="0 0 24 24" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            ${esc(D.widget2.text)}
        </a>`;
    }
    if (D.widget3 && D.widget3.on) {
        floatBtns += `<a class="float-btn costco" href="${esc(D.widget3.url)}" target="_blank">
            <svg viewBox="0 0 24 24" fill="white"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            ${esc(D.widget3.text)}
        </a>`;
    }
    if (floatBtns) {
        document.body.insertAdjacentHTML('beforeend', `<div class="float-widgets">${floatBtns}</div>`);
    }
}

// 平台偵測：Android 用 intent://，iOS 用 m.me（Universal Link），桌面新分頁
function openMessenger(e, url) {
    const m = url.match(/m\.me\/([^?\/#]+)/);
    if (!m) return true; // 非 m.me 連結，讓瀏覽器預設處理
    e.preventDefault();
    const username = m[1];
    const ua = navigator.userAgent;
    if (/Android/i.test(ua)) {
        window.location.href = `intent://user/${username}#Intent;scheme=fb-messenger;package=com.facebook.orca;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    } else if (/iPad|iPhone|iPod/.test(ua)) {
        window.location.href = url;
    } else {
        window.open(url, '_blank');
    }
    return false;
}

render();

// Meta Pixel 按鈕點擊事件追蹤（fire-and-forget，不阻擋跳轉）
document.addEventListener('click', function(e) {
    const a = e.target.closest('[data-fb-event]');
    if (!a) return;
    if (typeof fbq !== 'function') return;
    try {
        const urlParams = new URLSearchParams(location.search);
        fbq('track', a.dataset.fbEvent, {
            button_name: a.dataset.button || '',
            store: a.dataset.store || '',
            channel: a.dataset.channel || '',
            target_url: a.href || '',
            page_url: location.href,
            campaign: urlParams.get('utm_campaign') || 'organic',
            adset_id: urlParams.get('utm_adset') || '',
            ad_id: urlParams.get('utm_ad') || '',
            utm_content: urlParams.get('utm_content') || '',
            utm_term: urlParams.get('utm_term') || '',
            route_store: (ROUTED_IDX >= 0 && D.sec1[ROUTED_IDX]) ? (((D.sec1[ROUTED_IDX].label || '').match(/【([^】]+)】/) || [])[1] || '') : '',
            route_source: ROUTED_IDX >= 0 ? 'utm' : 'default'
        });
    } catch (err) { /* fail-safe: Pixel 異常不影響跳轉 */ }
}, true);
</script>
