function routedStoreIndex() {
    try {
        const p = new URLSearchParams(location.search);
        const hay = ((p.get('utm_campaign') || '') + ' ' + (p.get('utm_content') || '')).toLowerCase();
        if (!hay.trim()) return -1;
        for (const r of STORE_ROUTES) {
            if (r.rx.test(hay)) {
                const idx = (D.sec1 || []).findIndex(b => (b.label || '').includes(r.key));
                if (idx >= 0) return idx;
            }
        }
    } catch (e) {}
    return -1;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function buildBtns(sec) {
    // utm 命中 → 對應店置頂，featured/keepBright 對準新順序第 0 位；否則落回 DEFAULT 設定
    let items = D[sec] || [];
    let fi, keepBright;
    if (sec === 'sec1' && ROUTED_IDX >= 0) {
        items = [D.sec1[ROUTED_IDX], ...D.sec1.filter((_, i) => i !== ROUTED_IDX)];
        fi = 0;
        keepBright = [0];
    } else {
        fi = (sec === 'sec1' && typeof D.featuredStore === 'number' && D.featuredStore >= 0) ? D.featuredStore : -1;
        keepBright = (sec === 'sec1' && Array.isArray(D.featuredKeepBright)) ? D.featuredKeepBright : [];
    }
    return items.map((b, i) => {
        const icon = b.t === 'line' ? LINE_ICON : FB_ICON;
        const cls  = b.t === 'line' ? 'btn-line' : 'btn-fb';
        const isFeatured = sec === 'sec1' && i === fi;
        const isBright = isFeatured || keepBright.includes(i);
        const isDim = fi >= 0 && sec === 'sec1' && !isBright;
        const extra = isFeatured ? ' btn-featured' : (isDim ? ' btn-secondary' : '');
        const badge = isFeatured ? '<span class="featured-badge">⭐ 主力推薦</span>' : '';
        const storeMatch = (b.label || '').match(/【([^】]+)】/);
        const store = storeMatch ? storeMatch[1] : 'unknown';
        const channel = b.t === 'line' ? 'line_openchat' : 'fb_group';
        const addr = (b.addr || '').trim();
        // 有座標就用座標開地圖（門牌最準）；沒有就退回地址字串讓 Google 自己找。
        // 例：三重店地址寫「大有街1之12號」，Google 會解析成 1之35號，差一個門牌 —— 所以座標優先。
        const hasGeo = typeof b.lat === 'number' && typeof b.lng === 'number';
        const mapQuery = hasGeo ? `${b.lat},${b.lng}` : addr;
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapQuery)}`;
        const geoAttr = hasGeo ? ` data-lat="${b.lat}" data-lng="${b.lng}"` : '';
        // 地址文字是純文字（不可點），只有右邊那顆 .btn-map 會開地圖。
        // data-map-link 是給 Pixel 監聽用的排除標記，不可拿掉（見檔尾 click listener）
        const mapLine = addr ? `<span class="btn-meta">
                <span class="btn-addr-text">📍${esc(addr)}<span class="btn-distance"${geoAttr}></span></span>
                <a class="btn-map" href="${esc(mapUrl)}" target="_blank" rel="noopener"
                   aria-label="在地圖開啟 ${esc(store)}：${esc(addr)}"
                   data-map-link="1"
                   data-store="${esc(store)}">地圖</a>
            </span>` : '';
        // data-fb-event 只掛在 .btn-hit，不可往外層搬 —— 搬到 .btn-link 上，
        // 地址連結的 closest('[data-fb-event]') 就會命中外層，地圖點擊又會被算成 Lead。
        return `<div class="btn-link ${cls}${extra}">
            <a class="btn-hit" href="${esc(b.url)}" target="_blank"
            aria-label="${esc(b.label)}"
            data-fb-event="Lead"
            data-store="${esc(store)}"
            data-channel="${channel}"
            data-button="${esc(b.label)}"></a>
            ${icon}<span class="btn-body"><span class="btn-text">${esc(b.label)}</span>${mapLine}</span>${badge}
        </div>`;
    }).join('');
}

// 平台偵測：Android 用 intent://，iOS 用 m.me（Universal Link），桌面新分頁
function openMessenger(e, url) {
    const m = url.match(/m\.me\/([^?\/#]+)/);
    if (!m) return true; // 非 m.me 連結，讓瀏覽器預設處理
    e.preventDefault();
    const username = m[1];
    const ua = navigator.userAgent;
    if (/Android/i.test(ua)) {
        window.location.href = `intent://user/${username}#Intent;scheme=fb-messenger;package=com.facebook.orca;S.browser_fallback_url=${encodeURIComponent(url)};end`;
    } else if (/iPad|iPhone|iPod/.test(ua)) {
        window.location.href = url;
    } else {
        window.open(url, '_blank');
    }
    return false;
}

// ── 距離顯示（2026-08-11 試做）────────────────────────────────────────
// 只做「直線距離」：站上沒有路線 API，也刻意不接（靜態頁放 API key 有風險）。
// 文案一律標「直線」，不可寫成車程或路線距離。
// 距離只是資訊，不動排序 —— 置頂/⭐主力推薦是業主指定的商業規則（utm 分流 + featuredStore）。
function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

function formatDistance(km) {
    if (!isFinite(km) || km < 0) return '';
    if (km < 0.1) return '約 100m 內';
    if (km < 1) {
        const m = Math.round(km * 10) * 100;
        // 0.96km 這種會被進位成 1000m，改用公里表示，不要出現「約 1000m」
        return m >= 1000 ? '約 1.0km' : `約 ${m}m`;
    }
    if (km < 10) {
        const one = km.toFixed(1);
        // 9.96 會被 toFixed 進位成 10.0，和 10km 以上的整數格式不一致 → 交給下面的整數分支
        if (one !== '10.0') return `約 ${one}km`;
    }
    return `約 ${Math.round(km)}km`;
}

// 只更新距離文字；沒有 lat/lng 的門市（例如日後用編輯器新增的店）就保持空白，不影響地圖按鈕
function renderDistances(lat, lng) {
    let n = 0;
    document.querySelectorAll('.btn-distance[data-lat][data-lng]').forEach(function(box) {
        const sLat = parseFloat(box.dataset.lat);
        const sLng = parseFloat(box.dataset.lng);
        if (!isFinite(sLat) || !isFinite(sLng)) return;
        const txt = formatDistance(haversineKm(lat, lng, sLat, sLng));
        if (!txt) return;
        box.textContent = ` · 直線${txt}`;
        n++;
    });
    return n;
}

// 一律由使用者按按鈕才定位。落地頁一進站就跳系統權限對話框會嚇跑客人，直接影響加入社群的轉換。
function initGeo() {
    const btn = document.getElementById('locateBtn');
    const st  = document.getElementById('geoStatus');
    if (!btn || !st) return;
    btn.addEventListener('click', function() {
        if (!navigator.geolocation) { st.textContent = '此瀏覽器不支援定位，仍可點「地圖」按鈕'; return; }
        btn.disabled = true;
        st.textContent = '定位中…';
        let settled = false;
        // 看門狗：getCurrentPosition 的 timeout 依規格「不包含等待使用者授權的時間」，
        // 實測 Chrome 在權限對話框沒被回答時，8 秒 timeout 永遠不會觸發 →
        // 按鈕會一直卡在 disabled + 「定位中…」。這支計時器只負責把介面解鎖，
        // 不取消底下那個請求（使用者稍後才按允許的話，距離仍然會補上）。
        const watchdog = setTimeout(function() {
            if (settled) return;
            btn.disabled = false;
            st.textContent = '還在等定位授權，可先點「地圖」按鈕';
        }, 12000);
        const finish = function(text) {
            settled = true;
            clearTimeout(watchdog);
            btn.disabled = false;
            st.textContent = text;
        };
        navigator.geolocation.getCurrentPosition(function(pos) {
            const n = renderDistances(pos.coords.latitude, pos.coords.longitude);
            finish(n > 0 ? '已顯示直線距離（非車程）' : '目前沒有可計算距離的門市');
        }, function() {
            // 拒絕授權／逾時／非 HTTPS 都走這裡，頁面其餘功能不受影響
            finish('無法取得定位，仍可點「地圖」按鈕');
        }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
    });
}

render();
initGeo();

// Meta Pixel 按鈕點擊事件追蹤（fire-and-forget，不阻擋跳轉）
document.addEventListener('click', function(e) {
    // 地圖按鈕不是轉換：.btn-map 與帶 data-fb-event 的 .btn-hit 是兄弟節點，
    // 本來就不會被 closest 抓到；這行是第二道保險，
    // 避免日後有人把 data-fb-event 搬到外層膠囊就無聲灌水 Lead。
    if (e.target.closest('[data-map-link]')) return;
    const a = e.target.closest('[data-fb-event]');
    if (!a) return;
    if (typeof fbq !== 'function') return;
    try {
        const urlParams = new URLSearchParams(location.search);
        fbq('track', a.dataset.fbEvent, {
            button_name: a.dataset.button || '',
            store: a.dataset.store || '',
            channel: a.dataset.channel || '',
            target_url: a.href || '',
            page_url: location.href,
            campaign: urlParams.get('utm_campaign') || 'organic',
            adset_id: urlParams.get('utm_adset') || '',
            ad_id: urlParams.get('utm_ad') || '',
            utm_content: urlParams.get('utm_content') || '',
            utm_term: urlParams.get('utm_term') || '',
            route_store: (ROUTED_IDX >= 0 && D.sec1[ROUTED_IDX]) ? (((D.sec1[ROUTED_IDX].label || '').match(/【([^】]+)】/) || [])[1] || '') : '',
            route_source: ROUTED_IDX >= 0 ? 'utm' : 'default'
        });
    } catch (err) { /* fail-safe: Pixel 異常不影響跳轉 */ }
}, true);
